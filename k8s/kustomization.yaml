apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mern

resources:
  - mongodb.yaml
  - backend.yaml
  - frontend.yaml

# CI updates these tags with: kustomize edit set image ...
images:
  - name: sajwansarthak/mern-backend
    newTag: latest
  - name: sajwansarthak/mern-frontend
    newTag: latest
